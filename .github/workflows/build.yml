name: Build Squarefight APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # runner 自带 Android SDK，不调用 setup-android（其 sdkmanager tools 已失效）
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK root: $ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms
          ls $ANDROID_HOME/build-tools

      - name: Grant execute permission for gradlew
        run: chmod +x src/gradlew

      - name: Build Release APK
        working-directory: ${{ github.workspace }}/src
        run: ./gradlew :game0003-android:assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: $ANDROID_SDK_ROOT
          ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: squarefight-android5.1-apk
          path: src/game0003-android/build/outputs/apk/release/*.apk
          retention-days: 30